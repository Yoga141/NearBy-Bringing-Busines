---
# Deploy cPanel: HANYA menyalin hasil build frontend (frontend/dist) ke public_html.
#
# Sengaja tidak ada `npm install` / `npm run build` di sini: build dijalankan di
# komputer lokal, lalu folder frontend/dist ikut di-commit. Menjalankan build di
# server membuat deploy cPanel stuck/timeout.
#
# Backend (Laravel) tidak lagi di-deploy lewat file ini. Menyalin seluruh
# backend/ (termasuk ribuan file vendor/) ikut membuat deploy timeout.
deployment:
  tasks:
    - export DEPLOYPATH=/home/nearby/public_html/
    # Salin semua isi dist (index.html, assets/, logo.png). Folder api/ di
    # public_html tidak disentuh.
    - /bin/cp -R frontend/dist/* $DEPLOYPATH
    # `dist/*` melewatkan berkas diawali titik, jadi .htaccess (fallback SPA,
    # supaya refresh di /umkm/5 atau /dashboard tidak 404) dipasang terpisah.
    # Hanya ditambahkan kalau aturannya belum ada, supaya aturan lain di
    # .htaccess server (mis. handler PHP dari cPanel) tidak tertimpa.
    - grep -q "RewriteRule ^ index.html" ${DEPLOYPATH}.htaccess 2>/dev/null || cat frontend/dist/.htaccess >> ${DEPLOYPATH}.htaccess
