<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F0" />
      <stop offset="50%" stop-color="#FEEDDC" />
      <stop offset="100%" stop-color="#FCDDC7" />
    </linearGradient>
    <linearGradient id="bowlBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="brothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bowlBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <filter id="bowlShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgBowl)" />

  <!-- Background Patterns -->
  <g opacity="0.08" stroke="#9A3412" stroke-width="2" fill="none">
    <circle cx="90" cy="90" r="50" stroke-dasharray="6 6" />
    <circle cx="510" cy="90" r="45" />
    <circle cx="520" cy="290" r="55" stroke-dasharray="8 6" />
    <circle cx="80" cy="280" r="40" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="300" cy="180" r="140" fill="#FED7AA" opacity="0.4" filter="blur(25px)" />

  <g filter="url(#bowlShadow)">
    <!-- Chopsticks (leaning in bowl) -->
    <line x1="180" y1="50" x2="330" y2="180" stroke="#78350F" stroke-width="7" stroke-linecap="round" />
    <line x1="200" y1="40" x2="345" y2="180" stroke="#92400E" stroke-width="6" stroke-linecap="round" />

    <!-- Bowl Base Foot -->
    <path d="M260 260 H340 L330 275 H270 Z" fill="#9A3412" />

    <!-- Ceramic Bowl Body -->
    <path d="M190 160 C190 245 235 260 300 260 C365 260 410 245 410 160 Z" fill="url(#bowlBody)" stroke="#9A3412" stroke-width="3" />

    <!-- Bowl Rim Outer -->
    <ellipse cx="300" cy="160" rx="110" ry="24" fill="#C2410C" stroke="#9A3412" stroke-width="3" />
    <!-- Savory Golden Broth -->
    <ellipse cx="300" cy="160" rx="98" ry="19" fill="url(#brothGrad)" />

    <!-- Ingredients in Bowl: Meatballs, Noodles, Egg, Greens -->
    <!-- Noodles swirl -->
    <path d="M240 160 Q260 152 280 160 Q300 168 320 160 Q340 152 360 160" stroke="#FEF08A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M250 164 Q270 156 290 164 Q310 172 330 164" stroke="#FDE047" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Meatballs (Bakso) -->
    <circle cx="265" cy="155" r="18" fill="#B45309" stroke="#78350F" stroke-width="2" />
    <circle cx="295" cy="152" r="16" fill="#A16207" stroke="#78350F" stroke-width="2" />

    <!-- Boiled Egg Half -->
    <ellipse cx="340" cy="156" rx="16" ry="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="340" cy="156" r="7" fill="#F59E0B" />

    <!-- Scallion / Greens -->
    <rect x="270" y="142" width="7" height="6" rx="1.5" fill="#16A34A" transform="rotate(20 270 142)" />
    <rect x="315" y="145" width="7" height="6" rx="1.5" fill="#22C55E" transform="rotate(-15 315 145)" />
    <rect x="330" y="162" width="6" height="5" rx="1.5" fill="#15803D" transform="rotate(45 330 162)" />
  </g>

  <!-- Hot Steam Curves -->
  <g stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M265 110 Q255 90 268 70 Q278 52 268 35" />
    <path d="M300 100 Q312 80 300 62 Q290 44 302 26" />
    <path d="M335 110 Q325 88 338 68 Q348 50 338 32" />
  </g>

  <!-- Label Badge -->
  <g transform="translate(180, 316)" filter="url(#bowlShadow)">
    <rect width="240" height="42" rx="21" fill="url(#bowlBadge)" />
    <circle cx="32" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.22" />
    <path d="M25 21C25 25 32 26 32 26C32 26 39 25 39 21Z" stroke="#FFFFFF" stroke-width="2" fill="none" />
    <text x="56" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">SAJIAN SPESIAL</text>
  </g>
</svg>
