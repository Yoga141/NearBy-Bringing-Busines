<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EE" />
      <stop offset="50%" stop-color="#FDF1DF" />
      <stop offset="100%" stop-color="#F5E4C8" />
    </linearGradient>
    <linearGradient id="plateRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EADBCE" />
    </linearGradient>
    <linearGradient id="dishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C98A2E" />
      <stop offset="100%" stop-color="#E09F3E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgPlate)" />

  <!-- Subtle Culinary Pattern Circles -->
  <g opacity="0.07" stroke="#92400E" stroke-width="2" fill="none">
    <circle cx="80" cy="70" r="45" stroke-dasharray="6 6" />
    <circle cx="520" cy="300" r="60" stroke-dasharray="8 6" />
    <circle cx="530" cy="80" r="35" />
    <circle cx="70" cy="310" r="50" />
  </g>

  <!-- Ambient Culinary Glow -->
  <circle cx="300" cy="190" r="140" fill="#FDE68A" opacity="0.35" filter="blur(20px)" />

  <!-- Plate Shadow & Base -->
  <g filter="url(#shadow)">
    <!-- Outer Plate -->
    <circle cx="300" cy="180" r="115" fill="url(#plateRim)" stroke="#DFD0BF" stroke-width="3" />
    <!-- Inner Rim -->
    <circle cx="300" cy="180" r="92" fill="#FFFFFF" stroke="#EFE4D6" stroke-width="2" />
    <!-- Dish Well -->
    <circle cx="300" cy="180" r="76" fill="#FFFBF5" />

    <!-- Food Composition: Rice & Savory Dish -->
    <!-- Fragrant Rice Centerpiece -->
    <ellipse cx="275" cy="182" rx="42" ry="38" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <path d="M265 160 Q275 152 285 160 Q295 168 285 178 Q275 185 265 178 Z" fill="#F1F5F9" />
    <circle cx="275" cy="172" r="2.5" fill="#EAB308" />

    <!-- Main Dish / Sate / Rendang / Ayam Bakar -->
    <ellipse cx="325" cy="170" rx="32" ry="24" fill="url(#dishGrad)" />
    <ellipse cx="320" cy="195" rx="30" ry="20" fill="#92400E" />

    <!-- Garnish & Greens -->
    <path d="M305 155 Q315 145 320 155 Q310 162 305 155 Z" fill="#22C55E" />
    <path d="M322 153 Q330 142 334 153 Q326 158 322 153 Z" fill="#16A34A" />
    <!-- Red Chili Garnish -->
    <path d="M275 156 Q282 148 290 152" stroke="#EF4444" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Fork (Left) -->
    <g transform="translate(130, 95)" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M25 0 V85 M25 85 V170" stroke-width="4" stroke="#64748B" />
      <path d="M12 0 C12 35 38 35 38 0" stroke="#64748B" />
      <path d="M25 0 V35" stroke="#64748B" />
    </g>

    <!-- Spoon (Right) -->
    <g transform="translate(435, 95)" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="20" cy="30" rx="16" ry="26" fill="#F1F5F9" stroke="#64748B" stroke-width="3.5" />
      <path d="M20 56 V170" stroke-width="4" />
    </g>
  </g>

  <!-- Steam Whisps -->
  <g stroke="#D97706" stroke-width="2.5" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M270 90 Q260 72 272 56 Q280 42 270 28" />
    <path d="M300 85 Q310 68 298 52 Q290 38 300 24" />
    <path d="M330 92 Q320 74 332 58 Q340 44 330 30" />
  </g>

  <!-- Bottom Label Pill -->
  <g transform="translate(180, 316)" filter="url(#shadow)">
    <rect width="240" height="42" rx="21" fill="url(#badgeGrad)" />
    <!-- Food Icon in pill -->
    <circle cx="32" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.22" />
    <path d="M26 21H38 M32 15V27" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <text x="56" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">KULINER NUSANTARA</text>
  </g>
</svg>
