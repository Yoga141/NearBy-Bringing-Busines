<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDrink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="50%" stop-color="#E6F7ED" />
      <stop offset="100%" stop-color="#D3EFE0" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coffeeCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="drinkBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="drinkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgDrink)" />

  <!-- Background Decorative Rings -->
  <g opacity="0.08" stroke="#047857" stroke-width="2" fill="none">
    <circle cx="100" cy="80" r="50" stroke-dasharray="6 6" />
    <circle cx="500" cy="110" r="40" />
    <circle cx="510" cy="290" r="65" stroke-dasharray="8 6" />
    <circle cx="85" cy="290" r="45" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="280" cy="180" r="140" fill="#A7F3D0" opacity="0.45" filter="blur(25px)" />

  <g filter="url(#drinkShadow)">
    <!-- Tall Iced Drink Cup (Left) -->
    <!-- Straw -->
    <path d="M250 50 L275 140" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    <path d="M230 45 L250 50" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />

    <!-- Cup Body -->
    <path d="M205 130 L220 255 C221 262 227 268 235 268 H295 C303 268 309 262 310 255 L325 130 Z" fill="url(#cupGrad)" stroke="#047857" stroke-width="3" stroke-linejoin="round" />

    <!-- Cup Dome Lid -->
    <path d="M195 130 C195 105 235 90 265 90 C295 90 335 105 335 130 Z" fill="#FFFFFF" fill-opacity="0.85" stroke="#059669" stroke-width="2.5" />
    <ellipse cx="265" cy="130" rx="70" ry="7" fill="#E2E8F0" />

    <!-- Ice Cubes inside cup -->
    <rect x="235" y="150" width="24" height="24" rx="5" fill="#FFFFFF" fill-opacity="0.45" transform="rotate(12 235 150)" />
    <rect x="270" y="175" width="22" height="22" rx="5" fill="#FFFFFF" fill-opacity="0.45" transform="rotate(-15 270 175)" />
    <rect x="240" y="210" width="26" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.35" transform="rotate(8 240 210)" />

    <!-- Cup Sleeve -->
    <path d="M211 175 L216 218 H314 L319 175 Z" fill="#FFFFFF" fill-opacity="0.9" />
    <path d="M245 196 H285" stroke="#10B981" stroke-width="3" stroke-linecap="round" />

    <!-- Coffee Mug (Right) -->
    <!-- Mug Handle -->
    <path d="M410 185 C435 185 435 230 410 230" stroke="#78350F" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Mug Body -->
    <rect x="340" y="170" width="75" height="85" rx="14" fill="url(#coffeeCup)" stroke="#451A03" stroke-width="2.5" />
    <!-- Mug Rim & Coffee Top -->
    <ellipse cx="377" cy="170" rx="37" ry="11" fill="#451A03" stroke="#78350F" stroke-width="2" />
    <ellipse cx="377" cy="170" rx="31" ry="8" fill="#592C0E" />
    <!-- Latte Art / Swirl -->
    <path d="M365 170 Q377 165 390 170" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Coffee Saucer -->
    <ellipse cx="377" cy="258" rx="50" ry="10" fill="#E5E7EB" stroke="#CBD5E1" stroke-width="2" />

    <!-- Coffee Steam -->
    <path d="M368 150 Q360 135 368 120 Q376 108 368 95" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.4" fill="none" />
    <path d="M388 145 Q396 130 388 115 Q380 102 388 88" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.4" fill="none" />
  </g>

  <!-- Drink Badge -->
  <g transform="translate(170, 316)" filter="url(#drinkShadow)">
    <rect width="260" height="42" rx="21" fill="url(#drinkBadge)" />
    <circle cx="32" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.22" />
    <path d="M28 26 L30 16 H35 L33 26 Z" stroke="#FFFFFF" stroke-width="2" fill="none" />
    <text x="56" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">MINUMAN &amp; KOPI SEGAR</text>
  </g>
</svg>
