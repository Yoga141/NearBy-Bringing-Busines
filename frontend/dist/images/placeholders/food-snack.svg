<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSnack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="snackGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="snackBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="snackShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgSnack)" />

  <!-- Background Accents -->
  <g opacity="0.08" stroke="#78350F" stroke-width="2" fill="none">
    <circle cx="85" cy="80" r="45" stroke-dasharray="6 6" />
    <circle cx="515" cy="100" r="40" />
    <circle cx="510" cy="285" r="55" stroke-dasharray="8 6" />
    <circle cx="95" cy="295" r="50" />
  </g>

  <!-- Glow -->
  <circle cx="300" cy="180" r="140" fill="#FBBF24" opacity="0.35" filter="blur(25px)" />

  <g filter="url(#snackShadow)">
    <!-- Wooden Serving Tray / Board -->
    <rect x="170" y="140" width="260" height="130" rx="20" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3" />
    <rect x="185" y="152" width="230" height="106" rx="14" fill="#FFFFFF" />

    <!-- Assorted Delicious Snacks (Amplang, Pastry, Kue Tradisional) -->
    <!-- Crisp Golden Amplang Balls -->
    <circle cx="230" cy="190" r="22" fill="url(#snackGrad1)" stroke="#B45309" stroke-width="2" />
    <circle cx="265" cy="180" r="24" fill="#FBBF24" stroke="#D97706" stroke-width="2" />
    <circle cx="250" cy="220" r="20" fill="url(#snackGrad1)" stroke="#B45309" stroke-width="2" />

    <!-- Traditional Cake / Kue Lapis / Pie -->
    <rect x="305" y="170" width="45" height="55" rx="6" fill="#10B981" stroke="#047857" stroke-width="2" />
    <rect x="305" y="185" width="45" height="12" fill="#FDE047" />
    <rect x="305" y="202" width="45" height="12" fill="#F87171" />

    <!-- Pastry / Croissant / Roti Khas -->
    <path d="M360 215 C360 185 395 175 405 195 C415 215 390 230 360 215 Z" fill="#D97706" stroke="#92400E" stroke-width="2" />
    <path d="M375 195 C385 188 395 192 398 200" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Sweet Aroma Waves -->
  <g stroke="#D97706" stroke-width="2.5" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M250 115 Q240 98 250 82 Q260 68 250 52" />
    <path d="M310 105 Q322 88 310 72 Q300 56 312 40" />
    <path d="M370 115 Q360 96 372 78 Q382 62 372 46" />
  </g>

  <!-- Label Badge -->
  <g transform="translate(170, 316)" filter="url(#snackShadow)">
    <rect width="260" height="42" rx="21" fill="url(#snackBadge)" />
    <circle cx="32" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.22" />
    <circle cx="32" cy="21" r="6" fill="#FFFFFF" />
    <text x="56" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">KUDAPAN &amp; OLEH-OLEH</text>
  </g>
</svg>
